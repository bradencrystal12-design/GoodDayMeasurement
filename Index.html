<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>A Good Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F6F1;
    --ink: #17160F;
    --muted: #8A8878;
    --line: #E3E1D6;
    --physical: #C4472B;
    --spiritual: #45469B;
    --relational: #D89A2B;
    --financial: #1F7A4D;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Header ---------- */
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 6px; }
  h1 {
    font-family: 'Anton', sans-serif;
    font-size: 44px;
    line-height: 0.95;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .streak { text-align: right; }
  .streak-num {
    font-family: 'Anton', sans-serif;
    font-size: 44px;
    line-height: 0.95;
  }
  .streak-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .dateline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin: 10px 0 18px;
    min-height: 28px;
  }
  .dateline .editing { color: var(--ink); font-weight: 600; }
  .back-today {
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    display: none;
  }
  .back-today.show { display: block; }

  /* ---------- Checks ---------- */
  .checks { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
  .check {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 18px 16px;
    background: #FFFFFF;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    text-align: left;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
  }
  .check:active { transform: scale(0.985); }
  .check .box {
    width: 26px; height: 26px;
    border: 2px solid var(--c);
    border-radius: 8px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease;
  }
  .check .box svg { opacity: 0; transform: scale(0.5); transition: opacity 0.15s, transform 0.15s; }
  .check .name { font-size: 16px; font-weight: 700; letter-spacing: 0.01em; }
  .check .act { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .check.done { background: color-mix(in srgb, var(--c) 8%, #FFFFFF); border-color: var(--c); }
  .check.done .box { background: var(--c); }
  .check.done .box svg { opacity: 1; transform: scale(1); }
  .check.done .act { color: color-mix(in srgb, var(--c) 70%, var(--ink)); }

  /* ---------- Month grid ---------- */
  .month-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .month-title {
    font-family: 'Anton', sans-serif;
    font-size: 18px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .nav { display: flex; gap: 6px; }
  .nav button {
    width: 32px; height: 32px;
    border: 1.5px solid var(--line);
    background: #fff;
    border-radius: 10px;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
  }
  .nav button:disabled { opacity: 0.3; cursor: default; }
  .dow {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    margin-bottom: 6px;
  }
  .dow span {
    text-align: center;
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em;
    color: var(--muted);
  }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day {
    aspect-ratio: 1;
    border-radius: 9px;
    border: 1.5px solid var(--line);
    background: #fff;
    position: relative;
    cursor: pointer;
    overflow: hidden;
    padding: 0;
  }
  .day.empty { border: none; background: transparent; cursor: default; }
  .day.future { opacity: 0.35; cursor: default; }
  .day.selected { border-color: var(--ink); border-width: 2px; }
  .day .quad {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  }
  .day .q { opacity: 0; transition: opacity 0.2s; }
  .day .q.on { opacity: 1; }
  .day .q1 { background: var(--physical); }
  .day .q2 { background: var(--spiritual); }
  .day .q3 { background: var(--relational); }
  .day .q4 { background: var(--financial); }
  .day .num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    color: var(--ink);
    z-index: 2;
  }
  .day.full .num { color: #fff; font-weight: 700; }

  .legend {
    display: flex; justify-content: center; gap: 14px;
    margin-top: 14px; flex-wrap: wrap;
  }
  .legend span {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted);
  }
  .legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>A Good<br>Day</h1>
  <div class="streak">
    <div class="streak-num" id="streakNum">0</div>
    <div class="streak-label">day streak</div>
  </div>
</header>

<div class="dateline">
  <span id="dateLabel"></span>
  <button class="back-today" id="backToday">Today</button>
</div>

<div class="checks" id="checks"></div>

<div class="month-head">
  <div class="month-title" id="monthTitle"></div>
  <div class="nav">
    <button id="prevM" aria-label="Previous month">‹</button>
    <button id="nextM" aria-label="Next month">›</button>
  </div>
</div>
<div class="dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
<div class="grid" id="grid"></div>

<div class="legend">
  <span><i style="background:var(--physical)"></i>Physical</span>
  <span><i style="background:var(--spiritual)"></i>Spiritual</span>
  <span><i style="background:var(--relational)"></i>Relational</span>
  <span><i style="background:var(--financial)"></i>Financial</span>
</div>

<script>
const AREAS = [
  { id: 'physical',   name: 'Physical',   act: 'I show up to the gym.',      color: 'var(--physical)' },
  { id: 'spiritual',  name: 'Spiritual',  act: 'I read a scripture.',        color: 'var(--spiritual)' },
  { id: 'relational', name: 'Relational', act: 'I talk to a friend.',        color: 'var(--relational)' },
  { id: 'financial',  name: 'Financial',  act: 'I write something down.',    color: 'var(--financial)' },
];

const KEY = 'goodday-data';
let data = {};              // { "2026-07-15": ["physical", ...] }
let selectedDate = todayStr();
let viewYear, viewMonth;    // calendar view

function todayStr() {
  const d = new Date();
  return dstr(d.getFullYear(), d.getMonth(), d.getDate());
}
function dstr(y, m, day) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) { data = {}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch (e) { console.error('Save failed', e); }
}

function toggle(areaId) {
  const list = data[selectedDate] || [];
  const i = list.indexOf(areaId);
  if (i === -1) list.push(areaId); else list.splice(i, 1);
  if (list.length) data[selectedDate] = list; else delete data[selectedDate];
  save();
  renderChecks();
  renderGrid();
  renderStreak();
}

/* ---------- Render ---------- */
const checksEl = document.getElementById('checks');

function renderChecks() {
  const done = data[selectedDate] || [];
  checksEl.innerHTML = '';
  AREAS.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'check' + (done.includes(a.id) ? ' done' : '');
    btn.style.setProperty('--c', a.color);
    btn.innerHTML = `
      <span class="box"><svg width="15" height="12" viewBox="0 0 15 12" fill="none"><path d="M1.5 6.5L5.5 10.5L13.5 1.5" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span><div class="name">${a.name}</div><div class="act">${a.act}</div></span>`;
    btn.onclick = () => toggle(a.id);
    checksEl.appendChild(btn);
  });
  renderDateLabel();
}

function renderDateLabel() {
  const el = document.getElementById('dateLabel');
  const back = document.getElementById('backToday');
  const [y, m, d] = selectedDate.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const label = dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  if (selectedDate === todayStr()) {
    el.textContent = label;
    el.classList.remove('editing');
    back.classList.remove('show');
  } else {
    el.textContent = 'Editing ' + label;
    el.classList.add('editing');
    back.classList.add('show');
  }
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const first = new Date(viewYear, viewMonth, 1);
  const daysIn = new Date(viewYear, viewMonth + 1, 0).getDate();
  const today = todayStr();

  document.getElementById('monthTitle').textContent =
    first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  for (let i = 0; i < first.getDay(); i++) {
    const e = document.createElement('div');
    e.className = 'day empty';
    grid.appendChild(e);
  }
  for (let d = 1; d <= daysIn; d++) {
    const ds = dstr(viewYear, viewMonth, d);
    const done = data[ds] || [];
    const cell = document.createElement('button');
    const isFuture = ds > today;
    cell.className = 'day'
      + (isFuture ? ' future' : '')
      + (ds === selectedDate ? ' selected' : '')
      + (done.length === 4 ? ' full' : '');
    cell.innerHTML = `
      <span class="quad">
        <span class="q q1 ${done.includes('physical') ? 'on' : ''}"></span>
        <span class="q q2 ${done.includes('spiritual') ? 'on' : ''}"></span>
        <span class="q q3 ${done.includes('relational') ? 'on' : ''}"></span>
        <span class="q q4 ${done.includes('financial') ? 'on' : ''}"></span>
      </span>
      <span class="num">${d}</span>`;
    if (!isFuture) {
      cell.onclick = () => {
        selectedDate = ds;
        renderChecks();
        renderGrid();
      };
    }
    grid.appendChild(cell);
  }

  // Nav bounds: don't go into future months
  const now = new Date();
  document.getElementById('nextM').disabled =
    viewYear === now.getFullYear() && viewMonth === now.getMonth();
}

function renderStreak() {
  // Consecutive days ending today (or yesterday if today isn't full yet) where all 4 done
  let streak = 0;
  const d = new Date();
  const t = todayStr();
  if ((data[t] || []).length !== 4) d.setDate(d.getDate() - 1);
  while (true) {
    const ds = dstr(d.getFullYear(), d.getMonth(), d.getDate());
    if ((data[ds] || []).length === 4) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  document.getElementById('streakNum').textContent = streak;
}

/* ---------- Nav ---------- */
document.getElementById('prevM').onclick = () => {
  viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderGrid();
};
document.getElementById('nextM').onclick = () => {
  viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderGrid();
};
document.getElementById('backToday').onclick = () => {
  selectedDate = todayStr();
  const now = new Date();
  viewYear = now.getFullYear(); viewMonth = now.getMonth();
  renderChecks();
  renderGrid();
};

/* ---------- Init ---------- */
(function init() {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
  load();
  renderChecks();
  renderGrid();
  renderStreak();
})();
</script>
</body>
</html>
